# SPECTRUM sea-level forecast: runtime environment.
#
# Every package is pinned to the version imported in the macOS development
# environment (conda env "python2025", Python 3.13.7, osx-64 under Rosetta 2):
# first the direct dependencies, then the transitive ones.  The results of
# record come from the linux/arm64 container run built from these pins.
# The fully resolved, per-platform locks are conda-linux-64.lock and
# conda-linux-aarch64.lock (generated from this file with conda-lock; see
# VERSIONS.md).  Deviations from production are listed in VERSIONS.md.
name: spectrum
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13.7
  - pip=26.0.1
  - setuptools=82.0.0
  - setuptools-scm=10.2.1     # build-system requirement of pyproject.toml (version is static)

  # Numerics.  BLAS/LAPACK: OpenBLAS 0.3.30, OpenMP threading layer, as in
  # production (libopenblas 0.3.30 openmp_h6006d49_4, osx-64).
  - numpy=2.3.2
  - scipy=1.16.1
  - libblas=*=*openblas
  - libopenblas=0.3.30=openmp*
  - threadpoolctl=3.6.0       # used by environment/check_env.py to report BLAS threads

  # Data handling and I/O
  - pandas=2.3.2
  - pytables=3.10.2           # pandas.read_hdf / HDFStore
  - numexpr=2.14.1            # pytables dependency, pinned to production
  - h5py=3.15.1
  - netcdf4=1.7.2             # xarray backend (selected first by engine autodetection)
  - cftime=1.6.5
  - xarray=2026.2.0
  - openpyxl=3.1.5            # pandas.read_excel on .xlsx inputs
  - tqdm=4.67.3

  # Statistics and sampling
  - statsmodels=0.14.6
  - emcee=3.1.6
  - arviz=0.23.4
  - corner=2.2.3

  # Plotting
  - matplotlib-base=3.10.6    # production had the "matplotlib" metapackage; -base omits GUI toolkits
  - seaborn=0.13.2

  # Notebook execution (run_pipeline.sh uses jupyter nbconvert --execute)
  - jupyter_core=5.9.1
  - nbconvert-core=7.17.0
  - nbclient=0.10.4
  - nbformat=5.10.4
  - ipykernel=7.2.0
  - ipython=9.10.0
  - jupyter_client=8.8.0

  # Tests
  - pytest=9.0.2

  # Preprocessing and data-download scripts only (shipped, not run by
  # run_pipeline.sh): see VERSIONS.md for which script needs which package.
  - gsw=3.6.23                # TEOS-10 (en4_thermosteric, thermosteric_eos_coefficient)
  - cartopy=0.25.0            # Natural Earth coastline (make_greenland_mask)
  - shapely=2.1.2             # make_greenland_mask
  - fsspec=2026.2.0           # HTTP byte-range reads (extract_mar_protect_smb), zarr over HTTPS
  - aiohttp=3.12.15           # fsspec HTTP filesystem backend
  - requests=2.34.2           # fsspec HTTP / Pangeo and ESGF catalog queries
  - zarr=3.1.6                # xarray.open_zarr (cmip6_zostoga, gcm_greenland_temperature)
  - dask-core=2025.9.1        # xarray.open_mfdataset (cmip6_zostoga)
  - plotly=6.5.2              # read_process_datafiles.ipynb

  # ---------------------------------------------------------------------------
  # Transitive dependencies, pinned to the versions in the production env so
  # that the solver does not drift (e.g. python-dateutil 4.0, pillow 13,
  # contourpy 1.4 were chosen when only direct dependencies were pinned).
  # Generated from the production `conda list` / `pip freeze`; build strings
  # are left free because linux builds differ from osx-64.  Not pinned:
  # ca-certificates, certifi, openssl (TLS only; no effect on results), and
  # multidict 6.6.4 / propcache 0.3.2 (aiohttp helpers; these versions do not
  # solve on conda-forge for linux-aarch64; the locks have 6.9.1 / 0.5.4).
  # ---------------------------------------------------------------------------
  - _openmp_mutex=4.5
  - aiohappyeyeballs=2.6.1
  - aiosignal=1.4.0
  - asttokens=3.0.1
  - attrs=25.4.0
