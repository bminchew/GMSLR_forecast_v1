<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPECTRUM Timeline Hinge</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Rubik:wght@900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ffffff; }
  #fig { position: relative; width: 1344px; height: 752px; background: #ffffff; overflow: hidden; }
  #fig svg { display: block; }
  text { font-family: 'Outfit', sans-serif; font-size: 20px; fill: #031D3A; }
  .h   { font-family: 'Rubik', sans-serif; font-weight: 900; }
  .lbl { font-weight: 600; }
  .mut { fill: #07456C; }
  .acc { fill: #036C9A; }
  .wht { fill: #ffffff; }
  .bar-txt { font-weight: 500; }
  .tick { fill: #07456C; }
</style>
</head>
<body>
<div id="fig">
<svg width="1344" height="752" viewBox="0 0 1344 752" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" orient="auto" markerWidth="14" markerHeight="14" refX="12" refY="7" markerUnits="userSpaceOnUse">
      <path d="M0 0 L14 7 L0 14 Z" fill="#07456C"/>
    </marker>
  </defs>

  <!-- ================= HEADER ================= -->
  <text x="32" y="46" class="h" style="font-size:30px">SPECTRUM</text>

  <!-- legend -->
  <g transform="translate(640,26)">
    <rect x="0" y="2" width="30" height="20" rx="4" fill="#036C9A"/>
    <text x="40" y="19">Calibrated</text>
    <rect x="160" y="3" width="30" height="18" rx="4" fill="#ffffff" stroke="#036C9A" stroke-width="2"/>
    <text x="200" y="19">Emulated</text>
    <rect x="310" y="3" width="30" height="18" rx="4" fill="#ffffff" stroke="#036C9A" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="350" y="19">Adopted</text>
    <rect x="455" y="2" width="30" height="20" rx="4" fill="#AB6638"/>
    <text x="495" y="19">Storyline</text>
  </g>

  <!-- column headings -->
  <text x="570" y="86" text-anchor="middle" class="h" style="font-size:22px;fill:#036C9A">PAST · calibrate, then test</text>
  <text x="1050" y="86" text-anchor="middle" class="h" style="font-size:22px;fill:#036C9A">FUTURE · forecast</text>

  <!-- ================= HINGE LINE ================= -->
  <line x1="810" y1="64" x2="810" y2="704" stroke="#031D3A" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>

  <!-- ================= FORCING ROW ================= -->
  <text x="32" y="124" class="lbl">Forcing: GMST</text>
  <text x="32" y="150" class="mut">Greenland ocean T via</text>
  <text x="32" y="174" class="mut">Arctic amplification</text>

  <!-- observed GMST (schematic) -->
  <path d="M318 194 L330 194 C 480 194, 640 188, 810 176" fill="none" stroke="#031D3A" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="180" class="mut">observed</text>
  <!-- AR6 paths -->
  <path d="M810 176 C 960 168, 1120 164, 1290 162" fill="none" stroke="#72A3C3" stroke-width="4" stroke-linecap="round"/>
  <path d="M810 176 C 960 162, 1120 148, 1290 138" fill="none" stroke="#036C9A" stroke-width="4" stroke-linecap="round"/>
  <path d="M810 176 C 960 156, 1120 132, 1290 114" fill="none" stroke="#07456C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="810" cy="176" r="8" fill="#031D3A"/>
  <text x="840" y="128" class="mut">IPCC AR6 paths</text>
  <text x="1298" y="169">2 °C</text>
  <text x="1298" y="145">3 °C</text>
  <text x="1298" y="121">4 °C</text>

  <!-- ================= LEFT SPINE: forcing -> models -> sum ================= -->
  <line x1="318" y1="194" x2="318" y2="214" stroke="#07456C" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M326 214 L318 214 L318 494 L326 494" fill="none" stroke="#07456C" stroke-width="3" stroke-linejoin="round"/>
  <line x1="318" y1="494" x2="318" y2="530" stroke="#07456C" stroke-width="3"/>
  <circle cx="318" cy="548" r="17" fill="#031D3A"/>
  <text x="318" y="555" text-anchor="middle" class="wht" style="font-weight:600">Σ</text>
  <line x1="318" y1="566" x2="318" y2="590" stroke="#07456C" stroke-width="3"/>
  <path d="M318 590 Q318 604 330 604" fill="none" stroke="#07456C" stroke-width="3"/>

  <!-- ================= COMPONENT STRIPS ================= -->
  <!-- row centers 228 + 36k ; bars 26 tall -->
  <!-- 1 Thermosteric: NOAA 0-700 m 1955-2025 ; 0-2000 m 2005-2025 -->
  <text x="32" y="235" class="lbl">Thermosteric</text>
  <rect x="362" y="215" width="320" height="26" rx="5" fill="#036C9A"/>
  <rect x="682" y="215" width="128" height="26" rx="5" fill="#07456C"/>
  <rect x="678" y="215" width="8" height="26" fill="#07456C"/>
  <text x="374" y="235" class="wht bar-txt">NOAA 0–700 m</text>
  <text x="694" y="235" class="wht bar-txt">0–2000 m</text>

  <!-- 2 Glaciers: GlaMBIE 2000-2023 -->
  <text x="32" y="271" class="lbl">Glaciers</text>
  <rect x="650" y="251" width="147.2" height="26" rx="5" fill="#036C9A"/>
  <text x="662" y="271" class="wht bar-txt">GlaMBIE</text>

  <!-- 3 Antarctic Peninsula: IMBIE-3 1979-2023 -->
  <text x="32" y="307" class="lbl">Antarctic Peninsula</text>
  <rect x="515.6" y="287" width="281.6" height="26" rx="5" fill="#036C9A"/>
  <text x="527" y="307" class="wht bar-txt">IMBIE-3</text>

  <!-- 4 Greenland discharge: Mouginot 1972-2018 -->
  <text x="32" y="343" class="lbl">Greenland discharge</text>
  <rect x="470.8" y="323" width="294.4" height="26" rx="5" fill="#036C9A"/>
  <text x="482" y="343" class="wht bar-txt">Mouginot</text>

  <!-- 5 Greenland SMB: emulated; drift fitted to Mouginot SMB 1972-2018 -->
  <text x="32" y="379" class="lbl">Greenland SMB</text>
  <text x="460" y="379" text-anchor="end" class="acc">MAR emulator</text>
  <rect x="471.8" y="360" width="292.4" height="24" rx="5" fill="#ffffff" stroke="#036C9A" stroke-width="2"/>
  <text x="482" y="379" class="acc bar-txt">drift fit: Mouginot SMB</text>

  <!-- 6 East Antarctica: adopted; checked vs IMBIE-3 1979-2023 -->
  <text x="32" y="415" class="lbl">East Antarctica</text>
  <text x="505" y="415" text-anchor="end" class="acc">literature</text>
  <rect x="516.6" y="396" width="279.6" height="24" rx="5" fill="#ffffff" stroke="#036C9A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="527" y="415" class="acc bar-txt">IMBIE-3 check</text>

  <!-- 7 Terrestrial water storage: adopted, no record span -->
  <text x="32" y="451" class="lbl">Terrestrial water storage</text>
  <text x="340" y="451" class="acc">IPCC AR6 projections</text>

  <!-- 8 West Antarctica: storyline; IMBIE-3 trend 1979-2023 -->
  <text x="32" y="487" class="lbl">West Antarctica</text>
  <text x="505" y="487" text-anchor="end" style="fill:#AB6638">storyline</text>
  <rect x="515.6" y="467" width="281.6" height="26" rx="5" fill="#AB6638"/>
  <text x="527" y="487" class="wht bar-txt">IMBIE-3 trend</text>

  <!-- ================= SUM AND TEST ROW ================= -->
  <text x="32" y="555" class="lbl">Sum vs. observed GMSL</text>
  <text x="32" y="581" class="mut">GMSL is withheld</text>
  <text x="32" y="605" class="mut">from every calibration</text>

  <!-- GMSL stem (schematic) -->
  <path d="M330 604 C 560 602, 700 590, 810 560" fill="none" stroke="#031D3A" stroke-width="7" stroke-linecap="round"/>

  <!-- test spans -->
  <text x="595" y="639" text-anchor="end" class="mut">budget closes 93–101%</text>
  <rect x="605.2" y="620" width="204.8" height="26" rx="5" fill="#031D3A"/>
  <text x="617" y="640" class="wht bar-txt">altimetry</text>
  <rect x="330" y="654" width="480" height="26" rx="5" fill="#031D3A"/>
  <text x="342" y="674" class="wht bar-txt">hindcast to 1950</text>

  <!-- ================= FORECAST FAN (schematic) ================= -->
  <!-- fast West Antarctica: higher and wider (Earth, upper side) -->
  <path d="M810 560 C 960 520, 1130 400, 1290 214 L1290 400 C 1130 452, 960 520, 810 560 Z" fill="#AB6638"/>
  <!-- emissions spread, slow West Antarctica (blue, lower) -->
  <path d="M810 560 C 960 532, 1130 470, 1290 410 L1290 490 C 1130 520, 960 545, 810 560 Z" fill="#72A3C3"/>
  <circle cx="810" cy="560" r="10" fill="#031D3A"/>

  <text x="1278" y="330" text-anchor="end" class="wht" style="font-weight:600">fast West</text>
  <text x="1278" y="354" text-anchor="end" class="wht" style="font-weight:600">Antarctica</text>
  <text x="1280" y="470" text-anchor="end" style="font-weight:600">slow · 2, 3, 4 °C</text>
  <text x="1290" y="516" text-anchor="end" class="mut" style="font-style:italic">schematic</text>

  <text x="842" y="604" class="lbl">Forecast to 2100</text>
  <text x="842" y="628" class="mut">2000 members under 2, 3 and 4 °C</text>
  <text x="842" y="656" class="mut">Emissions set the warming-driven components;</text>
  <text x="842" y="680" class="mut">West Antarctica sets the tail</text>

  <!-- ================= TIME AXIS ================= -->
  <line x1="330" y1="704" x2="1290" y2="704" stroke="#031D3A" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#031D3A" stroke-width="2">
    <line x1="330" y1="704" x2="330" y2="712"/>
    <line x1="490" y1="704" x2="490" y2="712"/>
    <line x1="650" y1="704" x2="650" y2="712"/>
    <line x1="970" y1="704" x2="970" y2="712"/>
    <line x1="1130" y1="704" x2="1130" y2="712"/>
    <line x1="1290" y1="704" x2="1290" y2="712"/>
  </g>
  <text x="330" y="734" text-anchor="middle" class="tick">1950</text>
  <text x="490" y="734" text-anchor="middle" class="tick">1975</text>
  <text x="650" y="734" text-anchor="middle" class="tick">2000</text>
  <circle cx="810" cy="704" r="7" fill="#031D3A"/>
  <text x="810" y="736" text-anchor="middle" class="h" style="font-size:22px">2025</text>
  <text x="970" y="734" text-anchor="middle" class="tick">2050</text>
  <text x="1130" y="734" text-anchor="middle" class="tick">2075</text>
  <text x="1290" y="734" text-anchor="middle" class="tick">2100</text>
  <text x="32" y="734" class="mut" style="font-style:italic">All curves schematic</text>
</svg>
</div>
</body>
</html>
